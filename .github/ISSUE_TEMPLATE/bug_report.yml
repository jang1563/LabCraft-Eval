name: Bug report
description: Report a code, runner, packaging, or documentation bug.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What went wrong?
    validations:
      required: true
  - type: input
    id: commit
    attributes:
      label: Commit SHA or release
      description: If known, provide the commit SHA, tag, or result bundle.
    validations:
      required: false
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Include the command, task ID, model, seed, or file path if relevant.
      render: text
    validations:
      required: false
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: false
  - type: textarea
    id: context
    attributes:
      label: Additional context
    validations:
      required: false
