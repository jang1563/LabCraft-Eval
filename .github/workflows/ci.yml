name: CI

on:
  push:
    branches: ["main", "codex/**"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    name: Python tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: uv sync --extra dev --extra analysis --extra providers

      - name: Lint
        run: |
          uv run python scripts/model_matrix.py validate
          uv run ruff check .

      - name: Focused provenance and task checks
        run: >
          uv run pytest
          tests/test_citations.py
          tests/test_scope_compliance.py
          tests/test_inspect_task.py

      - name: Full unit test suite
        run: uv run pytest

      - name: Build wheel
        run: uv build --wheel

      - name: Package smoke
        run: |
          wheel_path="$(pwd)/$(find dist -name 'labcraft-*.whl' -print -quit)"
          test -n "$wheel_path"
          mkdir -p build/package_smoke
          cp scripts/package_smoke.py build/package_smoke/package_smoke.py
          cd build/package_smoke
          uv run --isolated --with "$wheel_path" python package_smoke.py

      - name: Build Docker environment
        run: |
          docker build -f environments/Dockerfile -t labcraft-eval-ci .
          docker run --rm labcraft-eval-ci python -c \
            "from src.inspect_task import safety_case_01; assert len(safety_case_01(seeds=1).dataset) == 30"

      - name: Hugging Face export smoke
        run: >
          uv run python scripts/export_hf_dataset.py
          --out-dir build/hf_export_smoke
          --release-name ci_smoke
          --no-results
          --copy-plots

      - name: Validate Hugging Face export smoke
        run: uv run python scripts/validate_hf_export.py build/hf_export_smoke

      - name: Hugging Face upload dry-run
        run: >
          uv run python scripts/upload_hf_dataset.py
          build/hf_export_smoke
          --repo-id example/LabCraft-Eval
