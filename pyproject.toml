[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "labcraft"
version = "0.1.2.dev0"
description = "Seeded agentic environment for evaluating models on benign microbiology tasks"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [
    { name = "The LabCraft-Eval Authors" },
]
keywords = [
    "agent-evaluation",
    "benchmark",
    "inspect-ai",
    "microbiology",
    "stochastic-simulation",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "inspect-ai==0.3.240",
]

[project.urls]
Homepage = "https://github.com/jang1563/LabCraft-Eval"
Repository = "https://github.com/jang1563/LabCraft-Eval"
Issues = "https://github.com/jang1563/LabCraft-Eval/issues"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "ruff>=0.1.0",
    "jsonschema>=4.20",
]
analysis = [
    "matplotlib>=3.7",
    "numpy>=1.24",
    "scikit-learn>=1.3",
]

[project.entry-points."inspect_ai"]
labcraft = "src.inspect_task"

[tool.setuptools.packages.find]
include = ["src*", "task_data*", "data*"]
namespaces = true

[tool.setuptools.package-data]
src = ["resources/*.txt"]
task_data = ["**/*.json", "**/*.md"]
data = ["**/*.json", "**/*.bib"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
