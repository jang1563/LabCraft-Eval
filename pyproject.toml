[build-system]
requires = ["setuptools>=82.0.1", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "labcraft"
version = "0.1.1"
description = "Stochastic agentic environment for evaluating frontier models on benign microbiology tasks"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [
    { name = "The LabCraft-Eval Authors" },
]
keywords = [
    "agent-evaluation",
    "benchmark",
    "inspect-ai",
    "microbiology",
    "stochastic-simulation",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "inspect-ai>=0.3.240",
]

[project.urls]
Homepage = "https://github.com/jang1563/LabCraft-Eval"
Repository = "https://github.com/jang1563/LabCraft-Eval"
Issues = "https://github.com/jang1563/LabCraft-Eval/issues"

[project.optional-dependencies]
dev = [
    "pytest>=9.1.0",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.15.17",
]
analysis = [
    "matplotlib>=3.11.0",
    "numpy>=2.4.6",
    "scikit-learn>=1.9.0",
]

[project.entry-points."inspect_ai"]
labcraft = "src.inspect_task"

[tool.setuptools.packages.find]
include = ["src*"]

[tool.setuptools.package-data]
src = ["../task_data/**/*.json", "../task_data/**/*.md", "../data/**/*.json", "../data/**/*.bib"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
